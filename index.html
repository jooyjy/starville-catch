<title>Starville Catch</title>

<style>
/* Layout: one teal screen, logo + two stacked play buttons, centered */
:root{--teal:#14a9b5;--teal-dk:#0b7f89;--white:#fff;color-scheme:light}
html,body{height:100%}
body{background:var(--teal);color:var(--white);font-family:Quicksand,Cairo,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:flex;flex-direction:column;align-items:center;gap:40px;padding-block:32px;width:100%}
.logo{width:min(320px,70vw);height:auto}
.btns{display:flex;flex-direction:column;gap:18px;width:min(340px,100%)}
.play{display:flex;align-items:center;gap:16px;text-align:left;background:var(--white);color:var(--teal-dk);text-decoration:none;border-radius:20px;padding:14px 22px;box-shadow:0 6px 0 var(--teal-dk);transition:transform .12s,box-shadow .12s}
.play.alt{background:transparent;color:var(--white);border:2px solid var(--white);box-shadow:0 6px 0 var(--teal-dk)}
.play:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--teal-dk)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-dk)}
.play:focus-visible{outline:3px solid var(--white);outline-offset:5px}
.play svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.play b{display:block;font-size:20px}
.play span{display:block;font-family:Cairo,sans-serif;font-size:14px;opacity:.85}
@media (prefers-reduced-motion:reduce){.play{transition:none}}
</style>
</head>

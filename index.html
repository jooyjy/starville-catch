<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Starville Catch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Cairo:wght@600&display=swap">
<style>
/* Layout: teal screen; soft orbs + twinkling sparkles + floating StarVille products frame a centered logo and two play buttons */
:root{--teal:#14a9b5;--teal-dk:#0b7f89;--teal-lt:#5fd0d8;--grey:#8b847c;--white:#fff;--gold:#ffd66b;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 40%,#1bb8c4 0%,var(--teal) 45%,var(--teal-dk) 100%);color:var(--white);font-family:Quicksand,Cairo,system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;background:var(--white);opacity:.08}
.o1{width:60vmax;height:60vmax;left:-25vmax;top:-30vmax}
.o2{width:45vmax;height:45vmax;right:-20vmax;bottom:-22vmax;opacity:.1}
.o3{width:14vmax;height:14vmax;right:12%;top:8%;opacity:.06}
.ring{position:absolute;left:50%;top:50%;width:min(560px,88vw);aspect-ratio:1;translate:-50% -50%;border:2px dashed rgba(255,255,255,.22);border-radius:50%;animation:spin 60s linear infinite}
.sp{position:absolute;width:var(--s);height:var(--s);animation:tw 3s ease-in-out infinite;animation-delay:var(--d)}
.sp svg{width:100%;height:100%;fill:var(--gold);filter:drop-shadow(0 0 6px rgba(255,214,107,.8))}
.prod{position:absolute;height:clamp(120px,26vh,240px);width:auto;filter:drop-shadow(0 20px 22px rgba(0,40,45,.35));animation:float 6s ease-in-out infinite}
.p1{left:6%;top:10%;rotate:-14deg}
.p2{right:7%;top:6%;rotate:12deg;animation-delay:-1.5s}
.p3{left:9%;bottom:6%;rotate:10deg;animation-delay:-3s}
.p4{right:8%;bottom:8%;rotate:-10deg;animation-delay:-4.5s}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:24px;width:100%}
.logo{width:min(320px,70vw);height:auto;filter:drop-shadow(0 4px 12px rgba(0,60,65,.25))}
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:13px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:6px 16px;border-radius:999px;backdrop-filter:blur(6px)}
.tag svg{width:12px;height:12px;fill:var(--gold)}
.btns{display:flex;flex-direction:column;gap:16px;width:min(340px,100%);margin-top:8px}
.play{display:flex;align-items:center;gap:16px;text-align:left;background:var(--white);color:var(--teal-dk);text-decoration:none;border-radius:20px;padding:14px 22px;box-shadow:0 6px 0 #075e66,0 16px 30px rgba(0,50,55,.25);transition:transform .12s,box-shadow .12s}
.play.alt{background:rgba(255,255,255,.12);color:var(--white);border:2px solid var(--white);backdrop-filter:blur(6px)}
.play:hover{transform:translateY(-2px)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #075e66}
.play:focus-visible{outline:3px solid var(--gold);outline-offset:5px}
.play svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.play b{display:block;font-size:20px}
.play span{display:block;font-family:Cairo,sans-serif;font-size:14px;opacity:.85}
.play .go{margin-left:auto;font-size:22px;font-weight:700}
.prod{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.prod{transition:scale .14s ease-out,rotate .5s cubic-bezier(.3,1.8,.5,1)}
.prod:hover{scale:1.04}
.prod.held{scale:1.1 .86;transition:scale .12s ease-out,rotate .12s ease-out}
.prod.jelly{animation:float 6s ease-in-out infinite,jelly .7s ease-out}
@keyframes jelly{0%{scale:1.1 .86}25%{scale:.9 1.12}45%{scale:1.06 .95}65%{scale:.97 1.03}85%{scale:1.01 .99}100%{scale:1}}
.bub{position:fixed;left:0;top:0;pointer-events:auto;cursor:pointer;border-radius:50%;width:var(--s);height:var(--s);will-change:transform;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 19%),radial-gradient(circle at 70% 75%,rgba(255,214,107,.3),rgba(255,255,255,0) 40%),radial-gradient(circle,rgba(255,255,255,.04) 56%,rgba(186,240,255,.45) 72%,rgba(255,190,240,.4) 86%,rgba(255,255,255,.9) 100%);
  box-shadow:inset 0 0 6px rgba(255,255,255,.6),0 4px 10px rgba(0,60,65,.12)}
.bub.pop{transition:opacity .22s,scale .22s;scale:1.6;opacity:0;pointer-events:none}
.dot{position:fixed;left:0;top:0;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;pointer-events:none;transition:transform .35s ease-out,opacity .35s}
@keyframes float{50%{transform:translateY(-16px)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
main>*{animation:rise .7s ease-out both}
main>*:nth-child(2){animation-delay:.1s}main>*:nth-child(3){animation-delay:.2s}
@media (max-width:700px){
  .prod{height:clamp(90px,17vh,150px);opacity:.9}
  .p1{left:-4%;top:3%}.p2{right:-3%;top:2%}.p3{left:-4%;bottom:2%}.p4{right:-4%;bottom:3%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(()=>{
const scene=document.querySelector('.scene'),first=scene.querySelector('.prod');
let bubs=[],raf=0,last=0,mx=-999,my=-999;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
function spawn(el){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const out=Math.atan2(innerHeight/2-cy,innerWidth/2-cx);           // toward the open middle
  for(let i=0;i<9;i++){
    const a=out+(Math.random()-.5)*2.2,s=14+Math.random()*30;
    const x=cx+Math.cos(a)*(r.width/2+s*.6),y=cy+Math.sin(a)*(r.height/2+s*.4);
    const b=document.createElement('i');b.className='bub';b.style.setProperty('--s',s+'px');
    scene.insertBefore(b,first);
    const o={el:b,x,y,s,vx:Math.cos(a)*(1.2+Math.random()*1.6),vy:Math.sin(a)*(1.2+Math.random()*1.6)-.4,ph:Math.random()*6,age:-i*4,life:260+Math.random()*160,sc:0};
    b.addEventListener('pointerdown',e=>{e.stopPropagation();pop(o)});
    bubs.push(o)}
  if(!raf)raf=requestAnimationFrame(tick)}
function pop(o){if(o.dead)return;o.dead=1;o.el.classList.add('pop');setTimeout(()=>o.el.remove(),240);
  const cx=o.x+o.s/2,cy=o.y+o.s/2;
  for(let k=0;k<6;k++){const d=document.createElement('i');d.className='dot';d.style.transform=`translate(${cx}px,${cy}px)`;document.body.appendChild(d);
    const a=k*Math.PI/3,R=o.s*.9;requestAnimationFrame(()=>{d.style.transform=`translate(${cx+Math.cos(a)*R}px,${cy+Math.sin(a)*R}px) scale(.3)`;d.style.opacity=0});setTimeout(()=>d.remove(),380)}}
function tick(t){
  for(const o of bubs){if(o.dead)continue;o.age++;if(o.age<0){o.el.style.opacity=0;continue}
    o.sc=Math.min(1,o.sc+.08);
    o.vx*=.985;o.vy=o.vy*.985-.012;                                  // drift out, then float up
    const dx=o.x+o.s/2-mx,dy=o.y+o.s/2-my,d2=dx*dx+dy*dy,R=90+o.s;   // shy of the cursor
    if(d2<R*R){const d=Math.sqrt(d2)||1,f=(R-d)/R*.9;o.vx+=dx/d*f;o.vy+=dy/d*f}
    o.x+=o.vx+Math.sin(o.age/18+o.ph)*.5;o.y+=o.vy;
    const fade=o.age>o.life?Math.max(0,1-(o.age-o.life)/40):1;
    o.el.style.opacity=fade;o.el.style.transform=`translate(${o.x}px,${o.y}px) scale(${o.sc*(1+Math.sin(o.age/10+o.ph)*.03)})`;
    if(fade===0||o.y<-80||o.x<-80||o.x>innerWidth+80){o.dead=1;o.el.remove()}}
  bubs=bubs.filter(o=>!o.dead);raf=bubs.length?requestAnimationFrame(tick):0}
function press(el,e){
  e.preventDefault();
  if(!el.dataset.base)el.dataset.base=parseFloat(getComputedStyle(el).rotate)||0;
  const r=el.getBoundingClientRect(),off=(e.clientX-(r.left+r.width/2))/(r.width/2);
  el.style.rotate=(+el.dataset.base-off*14)+'deg';                     // tilt away from the finger
  el.classList.remove('jelly');el.classList.add('held');
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  spawn(el)}
function release(el){
  if(!el.classList.contains('held'))return;
  el.classList.remove('held');void el.offsetWidth;el.classList.add('jelly');
  el.style.rotate=el.dataset.base+'deg'}
document.querySelectorAll('.prod').forEach(el=>{
  el.addEventListener('pointerdown',e=>press(el,e));
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,()=>release(el)));
  el.addEventListener('animationend',e=>{if(e.animationName==='jelly')el.classList.remove('jelly')});
});
})();
</script>
